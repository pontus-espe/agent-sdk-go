version: "2"

run:
  timeout: 5m
  # Examine test files as well
  tests: true
  allow-parallel-runners: true

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
  settings:
    staticcheck:
      checks:
        - all
        # Quickfix suggestions that go against the style used here: explicit
        # embedded field selectors and if/else chains over map lookups
        - -QF1003
        - -QF1008
  exclusions:
    generated: lax
    presets:
      - comments
      - std-error-handling
    rules:
      # Examples are documentation: they favour readability over rigour
      - path: ^examples/
        linters:
          - errcheck
      # Test helpers intentionally ignore errors from stub servers
      - path: _test\.go
        linters:
          - errcheck

formatters:
  enable:
    - gofmt
