version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: default
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.Date}}
    main: .

archives:
  - id: default
    ids:
      - default
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    files:
      - LICENSE
      - README.md
      - go.mod
      - go.sum
      - examples/**/*
      - pkg/**/*
      - docs/**/*
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip

checksum:
  name_template: 'checksums.txt'
  algorithm: sha256

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^ci:'
      - '^chore:'

release:
  github:
    owner: pontus-espe
    name: agent-sdk-go
  draft: false
  prerelease: auto
  footer: |
    ## Release Information

    Version: {{ .Version }}
    Commit: {{ .Commit }}
    Date: {{ .Date }}

    Documentation: https://pontus-espe.github.io/agent-sdk-go/
    API reference: https://pkg.go.dev/github.com/pontus-devoteam/agent-sdk-go

    For more information, visit [pontus-espe/agent-sdk-go](https://github.com/pontus-espe/agent-sdk-go)
